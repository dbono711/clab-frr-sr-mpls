frr defaults traditional
hostname bdr1
log syslog
log file /etc/frr/logs/bdr1.log
log record-priority
log timestamp precision 3
no log unique-id
!
debug bgp neighbor-events
debug bgp updates in
debug bgp updates out
debug isis route-events
!
interface eth1
 description to_p2_eth2
 ip address 10.0.1.7/31
 ip router isis 1
 isis hello padding during-adjacency-formation
 isis network point-to-point
exit
!
interface internet0
 description internet
 ip address 99.99.99.99/32
exit
!
interface lo
 ip address 172.16.0.15/32
 ip router isis 1
 isis passive
exit
!
router bgp 65000
 bgp router-id 172.16.0.15
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor RR peer-group
 neighbor RR remote-as internal
 neighbor RR update-source 172.16.0.15
 neighbor 172.16.0.8 peer-group RR
 !
 address-family ipv4 unicast
  network 99.99.99.99/32
 exit-address-family
 !
 address-family ipv4 labeled-unicast
  neighbor RR activate
  neighbor RR next-hop-self
 exit-address-family
exit
!
router isis 1
 is-type level-2-only
 net 49.0001.1721.6000.0015.00
 segment-routing on
 segment-routing node-msd 8
 segment-routing prefix 172.16.0.15/32 index 115
exit
!
mpls label dynamic-block 700000 799999
!
end

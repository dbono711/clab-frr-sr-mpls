frr defaults traditional
hostname pe1
log syslog
log file /etc/frr/logs/pe1.log
log record-priority
log timestamp precision 3
no log unique-id
!
route-map PERMIT_ALL permit 10
exit
!
route-map STEER-RED-VIA-P3 permit 10
 set sr-te color 200
exit
!
debug bgp neighbor-events
debug bgp updates in
debug bgp updates out
debug isis route-events
!
vrf RED
exit-vrf
!
vrf BLUE
exit-vrf
!
interface eth1
 description to_p1_eth1
 ip address 10.0.1.0/31
 ip router isis 1
 isis hello padding during-adjacency-formation
 isis network point-to-point
exit
!
interface eth2
 description RESERVED: to_p3_eth2
exit
!
interface eth3
 description to_c1_eth1
exit
!
interface eth3.10
 description to_c1_eth1.10_VRF_RED
 ip address 10.10.1.1/30
 ipv6 address 2001:c0de:10:1::1/64
exit
!
interface eth3.20
 description to_c1_eth1.20_VRF_BLUE
 ip address 10.10.1.5/30
 ipv6 address 2001:c0de:10:3::1/64
exit
!
interface eth4
 description to_c3_eth1
 ip address 10.11.1.1/30
exit
!
interface lo
 ip address 172.16.0.1/32
 ip router isis 1
 ipv6 address ::ffff:172.16.0.1/128
 isis passive
exit
!
router bgp 65000
 bgp router-id 172.16.0.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor RR peer-group
 neighbor RR remote-as internal
 neighbor RR update-source 172.16.0.1
 neighbor 172.16.0.8 peer-group RR
 !
 address-family ipv4 unicast
  network 10.11.1.0/30
 exit-address-family
 !
 address-family ipv4 labeled-unicast
  neighbor RR activate
  neighbor RR next-hop-self
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor RR activate
  neighbor RR next-hop-self
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor RR activate
  neighbor RR next-hop-self
 exit-address-family
exit
!
router bgp 65000 vrf RED
 bgp router-id 172.16.0.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 !
 address-family ipv4 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 172.16.0.1:10
  rt vpn both 65000:10
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 172.16.0.1:10
  rt vpn both 65000:10
  export vpn
  import vpn
 exit-address-family
exit
!
router bgp 65000 vrf BLUE
 bgp router-id 172.16.0.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 !
 address-family ipv4 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 172.16.0.1:20
  rt vpn both 65000:20
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 172.16.0.1:20
  rt vpn both 65000:20
  export vpn
  import vpn
 exit-address-family
exit
!
router isis 1
 is-type level-2-only
 net 49.0001.1721.6000.0001.00
 segment-routing on
 segment-routing node-msd 8
 segment-routing prefix 172.16.0.1/32 index 101
exit
!
mpls label dynamic-block 700000 799999
!
segment-routing
 traffic-eng
  segment-list SEG-VIA-P2
   index 10 mpls label 16102
   index 20 mpls label 16103
   index 30 mpls label 16105
   index 40 mpls label 16106
  exit
  segment-list SEG-VIA-P3
   index 10 mpls label 16102
   index 20 mpls label 16104
   index 30 mpls label 16105
   index 40 mpls label 16106
  exit
  policy color 100 endpoint 172.16.0.6
   binding-sid 30000
   candidate-path preference 100 name VIA-P2 explicit segment-list SEG-VIA-P2
  exit
  policy color 200 endpoint 172.16.0.6
   binding-sid 30001
   candidate-path preference 100 name VIA-P3 explicit segment-list SEG-VIA-P3
  exit
 exit
exit
!
end

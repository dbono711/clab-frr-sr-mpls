frr defaults traditional
hostname p3
log syslog
log file /etc/frr/logs/p3.log
log record-priority
log timestamp precision 3
no log unique-id
!
debug isis route-events
!
interface eth1
 description to_p1_eth3
 ip address 10.0.1.5/31
 ip router isis 1
 isis hello padding during-adjacency-formation
 isis network point-to-point
exit
!
interface eth2
 description RESERVED: to_pe1_eth2
exit
!
interface eth3
 description to_p4_eth2
 ip address 10.0.1.10/31
 ip router isis 1
 isis hello padding during-adjacency-formation
 isis metric 100
 isis network point-to-point
exit
!
interface lo
 ip address 172.16.0.4/32
 ip router isis 1
 isis passive
exit
!
router isis 1
 is-type level-2-only
 net 49.0001.1721.6000.0004.00
 segment-routing on
 segment-routing node-msd 8
 segment-routing prefix 172.16.0.4/32 index 104
exit
!
mpls label dynamic-block 700000 799999
!
end

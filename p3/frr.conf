frr defaults traditional
hostname p3
log syslog
log file /etc/frr/logs/p3.log
log record-priority
log timestamp precision 3
no log unique-id
!
debug isis route-events
!
affinity-map RED bit-position 0
affinity-map BLUE bit-position 1
!
interface eth1
 description to_p2_eth2
 ip address 10.0.1.5/31
 ip router isis 1
 isis hello padding during-adjacency-formation
 isis network point-to-point
 isis fast-reroute ti-lfa level-2 node-protection link-fallback
 link-params
  affinity RED
 exit-link-params
exit
!
interface eth2
 description to_bdr13_eth1
 ip address 10.0.1.18/31
 ip router isis 1
 isis hello padding during-adjacency-formation
 isis network point-to-point
 isis fast-reroute ti-lfa level-2 node-protection link-fallback
exit
!
interface eth3
 description to_p6_eth1
 ip address 10.0.1.14/31
 ip router isis 1
 isis hello padding during-adjacency-formation
 isis network point-to-point
 isis fast-reroute ti-lfa level-2 node-protection link-fallback
exit
!
interface eth4
 description to_pe12_eth2
 ip address 10.0.1.25/31
 ip router isis 1
 isis hello padding during-adjacency-formation
 isis network point-to-point
 isis fast-reroute ti-lfa level-2 node-protection link-fallback
 link-params
  affinity RED
 exit-link-params
exit
!
interface lo
 ip address 172.16.0.4/32
 ip router isis 1
 isis passive
exit
!
router isis 1
 is-type level-2-only
 net 49.0001.1721.6000.0004.00
 mpls-te on
 segment-routing on
 segment-routing node-msd 8
 segment-routing prefix 172.16.0.4/32 index 104
exit
!
mpls label dynamic-block 700000 799999
!
end

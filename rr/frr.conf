frr defaults traditional
hostname rr
log syslog
log file /etc/frr/logs/rr.log
log record-priority
log timestamp precision 3
no log unique-id
!
route-map PERMIT_ALL permit 10
exit
!
debug bgp neighbor-events
debug bgp updates in
debug bgp updates out
debug isis route-events
!
interface eth1
 description to_p1_eth4
 ip address 10.0.1.15/31
 ip router isis 1
 isis hello padding during-adjacency-formation
 isis network point-to-point
exit
!
interface lo
 ip address 172.16.0.8/32
 ip router isis 1
 ipv6 address ::ffff:172.16.0.8/128
 isis passive
exit
!
router bgp 65000
 bgp router-id 172.16.0.8
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp cluster-id 172.16.0.8
 neighbor RR peer-group
 neighbor RR remote-as internal
 neighbor RR update-source 172.16.0.8
 neighbor 172.16.0.1 peer-group RR
 neighbor 172.16.0.1 description pe1
 neighbor 172.16.0.6 peer-group RR
 neighbor 172.16.0.6 description pe2
 neighbor 172.16.0.15 peer-group RR
 neighbor 172.16.0.15 description bdr1
 !
 address-family ipv4 labeled-unicast
  neighbor RR activate
  neighbor RR route-reflector-client
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor RR activate
  neighbor RR route-reflector-client
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor RR activate
  neighbor RR route-reflector-client
 exit-address-family
exit
!
router isis 1
 is-type level-2-only
 net 49.0001.1721.6000.0008.00
exit
!
mpls label dynamic-block 700000 799999
!
end

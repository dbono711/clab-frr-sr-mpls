name: frr-sr-mpls

mgmt:
  network: br-frr-sr-mpls
  ipv4-subnet: 172.28.1.0/24

topology:
  kinds:
    linux:
      image: quay.io/frrouting/frr:10.7.1
  nodes:

    # PATH COMPUTATION ELEMENT
    ## pola (https://github.com/nttcom/pola)
    pola:
      kind: linux
      image: ghcr.io/nttcom/pola:v1.3.3
      mgmt-ipv4: 172.28.1.20
      binds:
        - pola/polad.yaml:/pola/polad.yaml
        - pola/pola-logs:/var/log/pola
        - pola/sr-policies:/pola/sr-policies
      cmd: polad -f /pola/polad.yaml

    # PROVIDER EDGE
    ## pe11
    pe11:
      kind: linux
      mgmt-ipv4: 172.28.1.11
      binds:
        - logs:/etc/frr/logs
        - pe11/daemons:/etc/frr/daemons
        - pe11/frr.conf:/etc/frr/frr.conf
        - pe11/vtysh.conf:/etc/frr/vtysh.conf
        - pe11/pe11.sh:/config/pe11.sh
      exec:
        - bash /config/pe11.sh

    # pe12
    pe12:
      kind: linux
      mgmt-ipv4: 172.28.1.12
      binds:
        - logs:/etc/frr/logs
        - pe12/daemons:/etc/frr/daemons
        - pe12/frr.conf:/etc/frr/frr.conf
        - pe12/vtysh.conf:/etc/frr/vtysh.conf
        - pe12/pe12.sh:/config/pe12.sh
      exec:
        - bash /config/pe12.sh

    # PROVIDER CORE
    # p1
    p1:
      kind: linux
      mgmt-ipv4: 172.28.1.2
      binds:
        - logs:/etc/frr/logs
        - p1/daemons:/etc/frr/daemons
        - p1/frr.conf:/etc/frr/frr.conf
        - p1/vtysh.conf:/etc/frr/vtysh.conf
        - p1/p1.sh:/config/p1.sh
      exec:
        - bash /config/p1.sh

    # p2
    p2:
      kind: linux
      mgmt-ipv4: 172.28.1.3
      binds:
        - logs:/etc/frr/logs
        - p2/daemons:/etc/frr/daemons
        - p2/frr.conf:/etc/frr/frr.conf
        - p2/vtysh.conf:/etc/frr/vtysh.conf
        - p2/p2.sh:/config/p2.sh
      exec:
        - bash /config/p2.sh

    # p3
    p3:
      kind: linux
      mgmt-ipv4: 172.28.1.4
      binds:
        - logs:/etc/frr/logs
        - p3/daemons:/etc/frr/daemons
        - p3/frr.conf:/etc/frr/frr.conf
        - p3/vtysh.conf:/etc/frr/vtysh.conf
        - p3/p3.sh:/config/p3.sh
      exec:
        - bash /config/p3.sh

    # p4
    p4:
      kind: linux
      mgmt-ipv4: 172.28.1.5
      binds:
        - logs:/etc/frr/logs
        - p4/daemons:/etc/frr/daemons
        - p4/frr.conf:/etc/frr/frr.conf
        - p4/vtysh.conf:/etc/frr/vtysh.conf
        - p4/p4.sh:/config/p4.sh
      exec:
        - bash /config/p4.sh

    # p5
    p5:
      kind: linux
      mgmt-ipv4: 172.28.1.6
      binds:
        - logs:/etc/frr/logs
        - p5/daemons:/etc/frr/daemons
        - p5/frr.conf:/etc/frr/frr.conf
        - p5/vtysh.conf:/etc/frr/vtysh.conf
        - p5/p5.sh:/config/p5.sh
      exec:
        - bash /config/p5.sh

    # p6
    p6:
      kind: linux
      mgmt-ipv4: 172.28.1.7
      binds:
        - logs:/etc/frr/logs
        - p6/daemons:/etc/frr/daemons
        - p6/frr.conf:/etc/frr/frr.conf
        - p6/vtysh.conf:/etc/frr/vtysh.conf
        - p6/p6.sh:/config/p6.sh
      exec:
        - bash /config/p6.sh

    # BORDER
    # bdr13
    bdr13:
      kind: linux
      mgmt-ipv4: 172.28.1.13
      binds:
        - logs:/etc/frr/logs
        - bdr13/daemons:/etc/frr/daemons
        - bdr13/frr.conf:/etc/frr/frr.conf
        - bdr13/vtysh.conf:/etc/frr/vtysh.conf
        - bdr13/bdr13.sh:/config/bdr13.sh
      exec:
        - bash /config/bdr13.sh

    # ROUTE REFLECTOR
    # rr14
    rr14:
      kind: linux
      mgmt-ipv4: 172.28.1.14
      binds:
        - logs:/etc/frr/logs
        - rr14/daemons:/etc/frr/daemons
        - rr14/frr.conf:/etc/frr/frr.conf
        - rr14/vtysh.conf:/etc/frr/vtysh.conf
        - rr14/rr14.sh:/config/rr14.sh
      exec:
        - bash /config/rr14.sh

    # CLIENTS
    ## c1
    c1:
      kind: linux
      image: wbitt/network-multitool:alpine-extra
      mgmt-ipv4: 172.28.1.30
      binds:
        - clients/client1.sh:/tmp/client1.sh
      exec:
        - bash /tmp/client1.sh

    # c2
    c2:
      kind: linux
      image: wbitt/network-multitool:alpine-extra
      mgmt-ipv4: 172.28.1.31
      binds:
        - clients/client2.sh:/tmp/client2.sh
      exec:
        - bash /tmp/client2.sh

    # c3
    c3:
      kind: linux
      image: wbitt/network-multitool:alpine-extra
      mgmt-ipv4: 172.28.1.32
      binds:
        - clients/client3.sh:/tmp/client3.sh
      exec:
        - bash /tmp/client3.sh

  links:

    # CORE
    ## p1-p2
    - endpoints: ["p1:eth2", "p2:eth1"]
    ## p1-p4
    - endpoints: ["p1:eth3", "p4:eth1"]
    ## p2-p5
    - endpoints: ["p2:eth3", "p5:eth3"]
    ## p2-p3
    - endpoints: ["p2:eth2", "p3:eth1"]
    ## p3-p6
    - endpoints: ["p3:eth3", "p6:eth1"]
    ## p4-p5
    - endpoints: ["p4:eth3", "p5:eth1"]
    ## p5-p6
    - endpoints: ["p5:eth2", "p6:eth2"]

    # ROUTE REFLECTOR
    ## p1-rr14
    - endpoints: ["p1:eth4", "rr14:eth1"]

    # EDGE
    ## pe11-p1
    - endpoints: ["pe11:eth1", "p1:eth1"]
    ## pe12-p6
    - endpoints: ["pe12:eth1", "p6:eth3"]

    # BORDER
    ## bdr13-p3
    - endpoints: ["bdr13:eth1", "p3:eth2"]

    # CLIENTS
    ## c1-pe11
    - endpoints: ["c1:eth1", "pe11:eth3"]
    ## c2-pe12
    - endpoints: ["c2:eth1", "pe12:eth3"]
    ## c3-pe11
    - endpoints: ["c3:eth1", "pe11:eth4"]

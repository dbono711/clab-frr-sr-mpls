name: frr-sr-mpls

mgmt:
  network: br-frr-sr-mpls
  ipv4-subnet: 172.28.1.0/24

topology:
  kinds:
    linux:
      image: quay.io/frrouting/frr:10.7.1
  nodes:

    # PROVIDER EDGE
    ## pe1
    pe1:
      kind: linux
      mgmt-ipv4: 172.28.1.2
      binds:
        - logs:/etc/frr/logs
        - pe1/daemons:/etc/frr/daemons
        - pe1/frr.conf:/etc/frr/frr.conf
        - pe1/vtysh.conf:/etc/frr/vtysh.conf
        - pe1/pe1.sh:/config/pe1.sh
      exec:
        - bash /config/pe1.sh

    # pe2
    pe2:
      kind: linux
      mgmt-ipv4: 172.28.1.3
      binds:
        - logs:/etc/frr/logs
        - pe2/daemons:/etc/frr/daemons
        - pe2/frr.conf:/etc/frr/frr.conf
        - pe2/vtysh.conf:/etc/frr/vtysh.conf
        - pe2/pe2.sh:/config/pe2.sh
      exec:
        - bash /config/pe2.sh

    # PROVIDER CORE
    # p1
    p1:
      kind: linux
      mgmt-ipv4: 172.28.1.4
      binds:
        - logs:/etc/frr/logs
        - p1/daemons:/etc/frr/daemons
        - p1/frr.conf:/etc/frr/frr.conf
        - p1/vtysh.conf:/etc/frr/vtysh.conf
        - p1/p1.sh:/config/p1.sh
      exec:
        - bash /config/p1.sh

    # p2
    p2:
      kind: linux
      mgmt-ipv4: 172.28.1.5
      binds:
        - logs:/etc/frr/logs
        - p2/daemons:/etc/frr/daemons
        - p2/frr.conf:/etc/frr/frr.conf
        - p2/vtysh.conf:/etc/frr/vtysh.conf
        - p2/p2.sh:/config/p2.sh
      exec:
        - bash /config/p2.sh

    # p3
    p3:
      kind: linux
      mgmt-ipv4: 172.28.1.6
      binds:
        - logs:/etc/frr/logs
        - p3/daemons:/etc/frr/daemons
        - p3/frr.conf:/etc/frr/frr.conf
        - p3/vtysh.conf:/etc/frr/vtysh.conf
        - p3/p3.sh:/config/p3.sh
      exec:
        - bash /config/p3.sh

    # p4
    p4:
      kind: linux
      mgmt-ipv4: 172.28.1.7
      binds:
        - logs:/etc/frr/logs
        - p4/daemons:/etc/frr/daemons
        - p4/frr.conf:/etc/frr/frr.conf
        - p4/vtysh.conf:/etc/frr/vtysh.conf
        - p4/p4.sh:/config/p4.sh
      exec:
        - bash /config/p4.sh

    # BORDER
    # bdr1
    bdr1:
      kind: linux
      mgmt-ipv4: 172.28.1.15
      binds:
        - logs:/etc/frr/logs
        - bdr1/daemons:/etc/frr/daemons
        - bdr1/frr.conf:/etc/frr/frr.conf
        - bdr1/vtysh.conf:/etc/frr/vtysh.conf
        - bdr1/bdr1.sh:/config/bdr1.sh
      exec:
        - bash /config/bdr1.sh

    # ROUTE REFLECTOR
    # rr
    rr:
      kind: linux
      mgmt-ipv4: 172.28.1.8
      binds:
        - logs:/etc/frr/logs
        - rr/daemons:/etc/frr/daemons
        - rr/frr.conf:/etc/frr/frr.conf
        - rr/vtysh.conf:/etc/frr/vtysh.conf
        - rr/rr.sh:/config/rr.sh
      exec:
        - bash /config/rr.sh

    # CLIENTS
    ## c1
    c1:
      kind: linux
      image: wbitt/network-multitool:alpine-extra
      mgmt-ipv4: 172.28.1.9
      binds:
        - clients/client1.sh:/tmp/client1.sh
      exec:
        - bash /tmp/client1.sh

    # c2
    c2:
      kind: linux
      image: wbitt/network-multitool:alpine-extra
      mgmt-ipv4: 172.28.1.10
      binds:
        - clients/client2.sh:/tmp/client2.sh
      exec:
        - bash /tmp/client2.sh

    # c3
    c3:
      kind: linux
      image: wbitt/network-multitool:alpine-extra
      mgmt-ipv4: 172.28.1.11
      binds:
        - clients/client3.sh:/tmp/client3.sh
      exec:
        - bash /tmp/client3.sh

  links:

    # CORE
    ## p1-p2
    - endpoints: ["p1:eth2", "p2:eth1"]
    ## p1-p3
    - endpoints: ["p1:eth3", "p3:eth1"]
    ## p3-p4
    - endpoints: ["p3:eth3", "p4:eth2"]
    ## p2-p4
    - endpoints: ["p2:eth3", "p4:eth1"]

    # ROUTE REFLECTOR
    ## p1-rr
    - endpoints: ["p1:eth4", "rr:eth1"]

    # EDGE
    ## pe1-p1
    - endpoints: ["pe1:eth1", "p1:eth1"]
    ## pe2-p4
    - endpoints: ["pe2:eth1", "p4:eth3"]

    # BORDER
    ## bdr1-p2
    - endpoints: ["bdr1:eth1", "p2:eth2"]

    # CLIENTS
    ## c1-pe1
    - endpoints: ["c1:eth1", "pe1:eth3"]
    ## c2-pe2
    - endpoints: ["c2:eth1", "pe2:eth3"]
    ## c3-pe1
    - endpoints: ["c3:eth1", "pe1:eth4"]

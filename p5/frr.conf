frr defaults traditional
hostname p5
log syslog
log file /etc/frr/logs/p5.log
log record-priority
log timestamp precision 3
no log unique-id
!
debug isis route-events
!
interface eth1
 description to_p4_eth3
 ip address 10.0.1.7/31
 ip router isis 1
 isis hello padding during-adjacency-formation
 isis network point-to-point
 isis fast-reroute ti-lfa level-2 node-protection link-fallback
exit
!
interface eth2
 description to_p6_eth2
 ip address 10.0.1.8/31
 ip router isis 1
 isis hello padding during-adjacency-formation
 isis metric 100
 isis network point-to-point
 isis fast-reroute ti-lfa level-2 node-protection link-fallback
exit
!
interface eth3
 description to_p2_eth3
 ip address 10.0.1.13/31
 ip router isis 1
 isis hello padding during-adjacency-formation
 isis metric 100
 isis network point-to-point
 isis fast-reroute ti-lfa level-2 node-protection link-fallback
exit
!
interface lo
 ip address 172.16.0.6/32
 ip router isis 1
 isis passive
exit
!
router isis 1
 is-type level-2-only
 net 49.0001.1721.6000.0006.00
 segment-routing on
 segment-routing node-msd 8
 segment-routing prefix 172.16.0.6/32 index 106
exit
!
mpls label dynamic-block 700000 799999
!
end

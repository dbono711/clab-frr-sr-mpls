frr defaults traditional
hostname pe11
log syslog
log file /etc/frr/logs/pe11.log
log record-priority
log timestamp precision 3
no log unique-id
!
route-map PERMIT_ALL permit 10
exit
!
debug bgp neighbor-events
debug bgp updates in
debug bgp updates out
debug isis route-events
!
affinity-map RED bit-position 0
affinity-map BLUE bit-position 1
!
vrf RED
exit-vrf
!
vrf BLUE
exit-vrf
!
interface eth1
 description to_p1_eth1
 ip address 10.0.1.0/31
 ip router isis 1
 isis fast-reroute ti-lfa level-2 node-protection link-fallback
 isis hello padding during-adjacency-formation
 isis network point-to-point
 link-params
  affinity RED
 exit-link-params
exit
!
interface eth2
 description to_p4_eth2
 ip address 10.0.1.22/31
 ip router isis 1
 isis fast-reroute ti-lfa level-2 node-protection link-fallback
 isis hello padding during-adjacency-formation
 isis network point-to-point
 link-params
  affinity BLUE
 exit-link-params
exit
!
interface eth3
 description to_c1_eth1
exit
!
interface eth3.10
 description to_c1_eth1.10_VRF_RED
 ip address 10.10.1.1/30
 ipv6 address 2001:c0de:10:1::1/64
exit
!
interface eth3.20
 description to_c1_eth1.20_VRF_BLUE
 ip address 10.10.1.5/30
 ipv6 address 2001:c0de:10:3::1/64
exit
!
interface eth4
 description to_c3_eth1
 ip address 10.11.1.1/30
exit
!
interface lo
 ip address 172.16.0.11/32
 ip router isis 1
 ipv6 address 2001:db8::11/128
 isis passive
exit
!
router bgp 65000
 bgp router-id 172.16.0.11
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor RR peer-group
 neighbor RR remote-as internal
 neighbor RR update-source 172.16.0.11
 neighbor 172.16.0.14 peer-group RR
 neighbor 172.28.1.21 remote-as internal
 neighbor 172.28.1.21 description gobgp-ted-collector
 !
 address-family ipv4 unicast
  network 10.11.1.0/30
  neighbor RR activate
  neighbor RR next-hop-self
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor RR activate
  neighbor RR next-hop-self
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor RR activate
  neighbor RR next-hop-self
 exit-address-family
 !
 address-family link-state link-state
  neighbor 172.28.1.21 activate
 exit-address-family
exit
!
router bgp 65000 vrf RED
 bgp router-id 172.16.0.11
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 !
 address-family ipv4 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 172.16.0.11:10
  rt vpn both 65000:10
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 172.16.0.11:10
  rt vpn both 65000:10
  export vpn
  import vpn
 exit-address-family
exit
!
router bgp 65000 vrf BLUE
 bgp router-id 172.16.0.11
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 !
 address-family ipv4 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 172.16.0.11:20
  rt vpn both 65000:20
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 172.16.0.11:20
  rt vpn both 65000:20
  export vpn
  import vpn
 exit-address-family
exit
!
router isis 1
 is-type level-2-only
 net 49.0001.1721.6000.0011.00
 mpls-te on
 mpls-te export
 segment-routing on
 segment-routing node-msd 8
 segment-routing prefix 172.16.0.11/32 index 111
exit
!
mpls label dynamic-block 700000 799999
!
segment-routing
 traffic-eng
  pcep
   pce POLA
    address ip 172.28.1.20
    source-address ip 172.28.1.11
    pce-initiated
   exit
   pcc
    peer POLA
   exit
  exit
 exit
exit
!
end

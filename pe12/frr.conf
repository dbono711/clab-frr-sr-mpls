frr defaults traditional
hostname pe12
log syslog
log file /etc/frr/logs/pe12.log
log record-priority
log timestamp precision 3
no log unique-id
!
route-map PERMIT_ALL permit 10
exit
!
debug bgp neighbor-events
debug bgp updates in
debug bgp updates out
debug isis route-events
!
affinity-map RED bit-position 0
affinity-map BLUE bit-position 1
!
vrf RED
exit-vrf
!
vrf BLUE
exit-vrf
!
interface eth1
 description to_p6_eth3
 ip address 10.0.1.17/31
 ip router isis 1
 isis fast-reroute ti-lfa level-2 node-protection link-fallback
 isis hello padding during-adjacency-formation
 isis network point-to-point
 link-params
  affinity BLUE
 exit-link-params
exit
!
interface eth2
 description to_p3_eth4
 ip address 10.0.1.24/31
 ip router isis 1
 isis fast-reroute ti-lfa level-2 node-protection link-fallback
 isis hello padding during-adjacency-formation
 isis network point-to-point
 link-params
  affinity RED
 exit-link-params
exit
!
interface eth3
 description to_c2_eth1
exit
!
interface eth3.10
 description to_c2_eth1.10_VRF_RED
 ip address 10.10.2.1/30
 ipv6 address 2001:c0de:10:2::1/64
exit
!
interface eth3.20
 description to_c2_eth1.20_VRF_BLUE
 ip address 10.10.2.5/30
 ipv6 address 2001:c0de:10:4::1/64
exit
!
interface lo
 ip address 172.16.0.12/32
 ip router isis 1
 ipv6 address 2001:db8::12/128
 isis passive
exit
!
router bgp 65000
 bgp router-id 172.16.0.12
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor RR peer-group
 neighbor RR remote-as internal
 neighbor RR update-source 172.16.0.12
 neighbor 172.16.0.14 peer-group RR
 !
 address-family ipv4 vpn
  neighbor RR activate
  neighbor RR next-hop-self
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor RR activate
  neighbor RR next-hop-self
 exit-address-family
exit
!
router bgp 65000 vrf RED
 bgp router-id 172.16.0.12
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 !
 address-family ipv4 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 172.16.0.12:10
  rt vpn both 65000:10
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 172.16.0.12:10
  rt vpn both 65000:10
  export vpn
  import vpn
 exit-address-family
exit
!
router bgp 65000 vrf BLUE
 bgp router-id 172.16.0.12
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 !
 address-family ipv4 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 172.16.0.12:20
  rt vpn both 65000:20
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 172.16.0.12:20
  rt vpn both 65000:20
  export vpn
  import vpn
 exit-address-family
exit
!
router isis 1
 is-type level-2-only
 net 49.0001.1721.6000.0012.00
 mpls-te on
 segment-routing on
 segment-routing node-msd 8
 segment-routing prefix 172.16.0.12/32 index 112
exit
!
mpls label dynamic-block 700000 799999
!
end
